<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>直近試合結果</title>
<link rel="stylesheet" href="/static/overlay.css">
<link rel="stylesheet" href="/static/match_log.css">
</head>
<body{{ debug_bg_style | safe }}>
{# Issue #422: バッジが1件も無い間はパネルごと描画しない(専用部屋配信は必ず0件から
   始まるため、「データがありません」が毎回配信画面に映ってしまうのを避ける)。
   overlay-refresh.jsのscriptタグはこの分岐の外に置くこと。bodyごと空にすると
   自動更新(body innerHTMLの差し替え、Issue #104)が止まり、最初の試合が終わっても
   ウィジェットが復帰しなくなる #}
{% if badges %}
<div class="match-log-panel">
<div class="match-log-row">
{% for badge in badges %}
<span class="match-log-badge" style="background-color: {{ badge.color }}; opacity: {{ badge.opacity }};">{{ badge.letter }}</span>
{% endfor %}
</div>
</div>
{% endif %}
<script src="/static/overlay-refresh.js" data-interval-ms="{{ refresh_interval_ms }}"></script>
</body>
</html>
