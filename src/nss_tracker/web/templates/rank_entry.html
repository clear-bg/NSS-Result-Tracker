<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ランク手動入力</title>
<link rel="stylesheet" href="/static/rank_entry.css">
</head>
<body>
<h1>ランク手動入力</h1>
<p class="rank-entry-admin-link"><a href="/admin" target="_blank" rel="noopener">設定画面(/admin)へ</a></p>
{% if status == "saved" %}
<p class="rank-entry-message rank-entry-message-success">記録しました。</p>
{% endif %}
{% if error %}
<p class="rank-entry-message rank-entry-message-error">{{ error }}</p>
{% endif %}

{% if clips %}
{% if pending_count > 0 %}
<p class="rank-entry-pending-count">未確定の試合: {{ pending_count }}件</p>
{% endif %}
<div class="rank-entry-layout">
  <div class="rank-entry-left" id="rank-entry-left"></div>
  <div class="rank-entry-right">
    <div class="rank-entry-video-wrap rank-entry-video-wrap-main">
      <video id="rank-entry-video" class="rank-entry-video" muted playsinline></video>
    </div>
    <div class="rank-entry-video-controls">
      <button type="button" id="rank-entry-video-play-btn" class="rank-entry-video-play-btn">&#9654;</button>
      <input type="range" id="rank-entry-video-seek" class="rank-entry-video-seek" min="0" max="1000" value="0">
      <span id="rank-entry-video-time" class="rank-entry-video-time">0:00 / 0:00</span>
    </div>
    <p class="rank-entry-gauge-label">ゲージ拡大(目盛り付き)</p>
    <div class="rank-entry-video-wrap rank-entry-video-wrap-gauge">
      <video id="rank-entry-gauge-video" class="rank-entry-gauge-video" muted playsinline></video>
    </div>
    <div class="rank-entry-video-controls">
      <button type="button" id="rank-entry-gauge-video-play-btn" class="rank-entry-video-play-btn">&#9654;</button>
      <input type="range" id="rank-entry-gauge-video-seek" class="rank-entry-video-seek" min="0" max="1000" value="0">
      <span id="rank-entry-gauge-video-time" class="rank-entry-video-time">0:00 / 0:00</span>
    </div>
    <div id="rank-entry-clip-selector" class="rank-entry-clip-selector"></div>
  </div>
</div>
{% else %}
<p class="rank-entry-empty">未確定の試合はありません。</p>
{% endif %}

<script id="rank-entry-clips-data" type="application/json">{{ clips | tojson }}</script>
<script>
(function () {
  const dataEl = document.getElementById("rank-entry-clips-data");
  if (!dataEl) {
    return;
  }
  let clips = JSON.parse(dataEl.textContent);
  const video = document.getElementById("rank-entry-video");
  const videoWrap = document.querySelector(".rank-entry-video-wrap-main");
  const gaugeVideo = document.getElementById("rank-entry-gauge-video");
  const gaugeVideoWrap = document.querySelector(".rank-entry-video-wrap-gauge");
  const gaugeLabel = document.querySelector(".rank-entry-gauge-label");
  const selector = document.getElementById("rank-entry-clip-selector");
  const left = document.getElementById("rank-entry-left");
  let selectedMatchId = null;
  let userSelected = false;

  // Issue #325: ブラウザ標準の<video controls>はコントロールを映像の下端に
  // 重ねて表示するため、映像内容(ランクバッジ・ゲージ)と重なってしまう問題があった
  // (#323/#324で試した「コントロール分の余白を確保する」対策では解消しなかった)。
  // <video>の外側の実DOM要素として再生ボタン・シークバーを自前で組むことで、
  // ブラウザのネイティブコントロール描画の実装に関わらず重なりを起こさないようにする。
  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) {
      return "0:00";
    }
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function attachCustomControls(mediaVideo, playBtn, seekInput, timeLabel) {
    let seeking = false;

    playBtn.addEventListener("click", function () {
      if (mediaVideo.paused) {
        mediaVideo.play();
      } else {
        mediaVideo.pause();
      }
    });
    mediaVideo.addEventListener("play", function () { playBtn.innerHTML = "&#10074;&#10074;"; });
    mediaVideo.addEventListener("pause", function () { playBtn.innerHTML = "&#9654;"; });

    mediaVideo.addEventListener("loadedmetadata", function () {
      timeLabel.textContent = formatTime(mediaVideo.currentTime) + " / " + formatTime(mediaVideo.duration);
    });
    mediaVideo.addEventListener("timeupdate", function () {
      if (!seeking && isFinite(mediaVideo.duration) && mediaVideo.duration > 0) {
        seekInput.value = String(Math.round((mediaVideo.currentTime / mediaVideo.duration) * 1000));
      }
      timeLabel.textContent = formatTime(mediaVideo.currentTime) + " / " + formatTime(mediaVideo.duration);
    });

    seekInput.addEventListener("pointerdown", function () { seeking = true; });
    seekInput.addEventListener("input", function () {
      if (isFinite(mediaVideo.duration) && mediaVideo.duration > 0) {
        mediaVideo.currentTime = (Number(seekInput.value) / 1000) * mediaVideo.duration;
      }
    });
    seekInput.addEventListener("pointerup", function () { seeking = false; });

    return function reset() {
      playBtn.innerHTML = "&#9654;";
      seekInput.value = "0";
      timeLabel.textContent = "0:00 / 0:00";
    };
  }

  const resetVideoControls = attachCustomControls(
    video,
    document.getElementById("rank-entry-video-play-btn"),
    document.getElementById("rank-entry-video-seek"),
    document.getElementById("rank-entry-video-time")
  );
  const resetGaugeVideoControls = attachCustomControls(
    gaugeVideo,
    document.getElementById("rank-entry-gauge-video-play-btn"),
    document.getElementById("rank-entry-gauge-video-seek"),
    document.getElementById("rank-entry-gauge-video-time")
  );

  function findClip(matchId) {
    return clips.find(function (c) { return c.match_id === matchId; }) || null;
  }

  function formatRank(value) {
    return value === null || value === undefined ? "未解決" : value;
  }

  function addRow(container, label, value, extraClass) {
    const row = document.createElement("div");
    row.className = "rank-entry-match-row" + (extraClass ? " " + extraClass : "");
    const labelSpan = document.createElement("span");
    labelSpan.textContent = label;
    const valueSpan = document.createElement("span");
    valueSpan.textContent = value;
    row.appendChild(labelSpan);
    row.appendChild(valueSpan);
    container.appendChild(row);
  }

  function renderLeftPanel(clip) {
    left.innerHTML = "";

    const info = document.createElement("div");
    info.className = "rank-entry-match-info";
    addRow(info, "試合終了", clip.detected_at_text);
    addRow(info, "結果", clip.result_text);
    addRow(info, "試合前ランク", formatRank(clip.rank_before));
    if (clip.rank_after_ocr !== null && clip.rank_after_ocr !== undefined) {
      addRow(info, "自動検知(参考)", clip.rank_after_ocr, "rank-entry-match-row-hint");
    }
    left.appendChild(info);

    if (clip.rank_after !== null && clip.rank_after !== undefined) {
      const confirmed = document.createElement("p");
      confirmed.className = "rank-entry-confirmed";
      confirmed.textContent = "確定済み: " + clip.rank_after;
      left.appendChild(confirmed);
      return;
    }

    if (clip.rank_before === null || clip.rank_before === undefined) {
      const blocked = document.createElement("p");
      blocked.className = "rank-entry-empty";
      blocked.textContent = "直前の試合のランクがまだ確定していないため、この試合は入力できません。先に直前の試合を確定させてください。";
      left.appendChild(blocked);
      return;
    }

    const form = document.createElement("form");
    form.method = "post";
    form.action = "/rank-entry";
    form.className = "rank-entry-form";

    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = "match_id";
    hidden.value = clip.match_id;
    form.appendChild(hidden);

    const inputRow = document.createElement("div");
    inputRow.className = "rank-entry-input-row";

    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.name = "rank_after";
    input.id = "rank_after";
    input.className = "rank-entry-input";
    input.autocomplete = "off";
    if (clip.rank_after_ocr !== null && clip.rank_after_ocr !== undefined) {
      // 初回表示時の初期値としてのみ使う。定期更新のたびにここへ来ても
      // (renderLeftPanelは同じ試合を選んだままの間は呼ばれないため)入力中の
      // 内容を勝手に上書きすることはない。値を戻したい場合は下の「推定値を使う」
      // ボタンから明示的に取り込む(ユーザー確認済み、モジュールdocstring参照)
      input.value = clip.rank_after_ocr;
    }
    // 入力欄を一度でも操作したら、以後の自動更新でこの試合から勝手に
    // 離れないようにする(定期更新中に別の試合の動画へ切り替わって
    // 入力内容を見失わないようにするため)
    input.addEventListener("focus", function () { userSelected = true; });
    input.addEventListener("input", function () { userSelected = true; });
    inputRow.appendChild(input);

    if (clip.rank_after_ocr !== null && clip.rank_after_ocr !== undefined) {
      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "rank-entry-copy-button";
      copyButton.textContent = "推定値を使う";
      copyButton.addEventListener("click", function () {
        input.value = clip.rank_after_ocr;
        input.focus();
        input.select();
      });
      inputRow.appendChild(copyButton);
    }

    form.appendChild(inputRow);

    const button = document.createElement("button");
    button.type = "submit";
    button.textContent = "記録";
    form.appendChild(button);

    left.appendChild(form);
    input.focus();
    input.select();
  }

  function renderSelector() {
    selector.innerHTML = "";
    clips.forEach(function (clip) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "rank-entry-clip-button" + (clip.match_id === selectedMatchId ? " rank-entry-clip-button-active" : "");
      button.textContent = clip.recency_label;
      button.addEventListener("click", function () {
        userSelected = true;
        selectClip(clip.match_id);
      });
      selector.appendChild(button);
    });
  }

  function selectClip(matchId) {
    const clip = findClip(matchId);
    if (!clip) {
      return;
    }
    // Issue #307のフィードバック: 定期更新(refresh)のたびにこの関数が同じ試合へ
    // 呼ばれ続けると、そのたびにrenderLeftPanel()が入力欄を推定値で上書きして
    // しまい、入力中の内容が消えてしまう不具合があった。既に選択済みの試合と
    // 同じ場合は左パネルを再描画しない(動画srcの再設定も、再生位置が
    // 巻き戻る副作用があるため同様にスキップする)
    const isSameMatch = matchId === selectedMatchId;
    selectedMatchId = matchId;
    if (!isSameMatch) {
      renderLeftPanel(clip);
      resetVideoControls();
      if (clip.has_clip) {
        videoWrap.style.display = "";
        video.src = "/rank-entry/clips/" + matchId + ".mp4?t=" + Date.now();
      } else {
        videoWrap.style.display = "none";
        video.removeAttribute("src");
      }
      // Issue #312: ゲージ動画もこのガードの外で毎回srcを再設定すると、定期更新
      // (5秒おき)のたびに読み込みが中断(abort)され続けて再生できなくなる不具合が
      // あった(通常動画と同じ理由でここに含める)
      resetGaugeVideoControls();
      if (clip.has_gauge_clip) {
        gaugeLabel.style.display = "";
        gaugeVideoWrap.style.display = "";
        gaugeVideo.src = "/rank-entry/gauge-clips/" + matchId + ".mp4?t=" + Date.now();
      } else {
        gaugeLabel.style.display = "none";
        gaugeVideoWrap.style.display = "none";
        gaugeVideo.removeAttribute("src");
      }
    }
    renderSelector();
  }

  function refresh() {
    fetch("/api/rank-entry-clips")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        clips = data.clips || [];
        if (clips.length === 0) {
          selector.innerHTML = "";
          left.innerHTML = "";
          resetVideoControls();
          video.removeAttribute("src");
          videoWrap.style.display = "none";
          resetGaugeVideoControls();
          gaugeVideo.removeAttribute("src");
          gaugeLabel.style.display = "none";
          gaugeVideoWrap.style.display = "none";
          selectedMatchId = null;
          return;
        }
        const stillAvailable = findClip(selectedMatchId) !== null;
        if (!userSelected || !stillAvailable) {
          selectClip(clips[0].match_id);
        } else {
          // 選択中の試合はそのまま(入力中の内容を保持する)。ボタンの並び・
          // ラベル(最新/1つ前等の繰り上がり)だけ最新化する
          renderSelector();
        }
      })
      .catch(function () {});
  }

  if (clips.length > 0) {
    selectClip(clips[0].match_id);
  }
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
